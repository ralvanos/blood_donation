name: blood_donation
description: Android app to track blood donations with countdown to next eligible donation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  fl_chart: ^1.2.0
  file_picker: ^11.0.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "blood-donation_icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
